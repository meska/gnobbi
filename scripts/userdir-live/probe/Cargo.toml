[package]
name = "userdir-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Crate standalone: dipende dal matrix-sdk 0.19.1 vendored nel repo,
# la stessa versione usata dall'app (non entra nel workspace Cargo).
[workspace]

[dependencies]
matrix-sdk = { path = "../../../vendor/matrix-sdk-0.19.1", default-features = false, features = ["rustls-aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
