[workspace]
members = ["crates/matrix-domain", "crates/matrix-engine", "crates/matrix-desktop", "crates/matrix-mobile"]
default-members = ["crates/matrix-domain", "crates/matrix-engine"]
exclude = ["vendor/matrix-sdk-0.19.1", "vendor/gpui-0.2.2"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 0
debug = 0

[profile.test]
opt-level = 0
debug = 0

# Delivery build only (`--profile dist`); dev/test keep the fast profiles above.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
strip = true
codegen-units = 16

[patch.crates-io]
matrix-sdk = { path = "vendor/matrix-sdk-0.19.1" }
# Wayland: modifiers/key before keymap panicked (client.rs unwrap); see vendor/gpui-0.2.2.patch.
gpui = { path = "vendor/gpui-0.2.2" }
