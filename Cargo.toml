[workspace]
members = ["crates/matrix-domain", "crates/matrix-engine", "crates/matrix-desktop", "crates/gnobbi-nse"]
default-members = ["crates/matrix-domain", "crates/matrix-engine"]
exclude = ["vendor/matrix-sdk-0.19.1", "vendor/matrix-sdk-search-0.19.1", "vendor/egui-6d518fc", "vendor/winit-a517b38"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 0
debug = 0

[profile.test]
opt-level = 0
debug = 0

# Delivery build only (`--profile dist`); dev/test keep the fast profiles above.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "thin"
strip = true
codegen-units = 16

[profile.dist-ios]
inherits = "dist"
# Size: iOS binary 129 MB -> 48 MB (IPA zip 40 -> 18 MB); opt-level s + fat LTO + 1 CGU. panic=abort would save 10 MB more but kills tokio tasks on panic: not adopted.
opt-level = "s"
lto = "fat"
codegen-units = 1

[patch.crates-io]
matrix-sdk = { path = "vendor/matrix-sdk-0.19.1" }
matrix-sdk-search = { path = "vendor/matrix-sdk-search-0.19.1" }
# egui frontend: storytold forks of egui (rev 6d518fc) and winit (rev a517b38).
ecolor = { path = "vendor/egui-6d518fc/crates/ecolor" }
emath = { path = "vendor/egui-6d518fc/crates/emath" }
epaint = { path = "vendor/egui-6d518fc/crates/epaint" }
epaint_default_fonts = { path = "vendor/egui-6d518fc/crates/epaint_default_fonts" }
egui = { path = "vendor/egui-6d518fc/crates/egui" }
egui-winit = { path = "vendor/egui-6d518fc/crates/egui-winit" }
egui-wgpu = { path = "vendor/egui-6d518fc/crates/egui-wgpu" }
egui_glow = { path = "vendor/egui-6d518fc/crates/egui_glow" }
eframe = { path = "vendor/egui-6d518fc/crates/eframe" }
egui_system_font_provider = { path = "vendor/egui-6d518fc/crates/egui_system_font_provider" }
winit = { path = "vendor/winit-a517b38" }
