[workspace]
members = ["crates/matrix-domain", "crates/matrix-engine", "crates/matrix-desktop"]
default-members = ["crates/matrix-domain", "crates/matrix-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 0
debug = 0

[profile.test]
opt-level = 0
debug = 0
