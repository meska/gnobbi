[package]
name = "matrix-mobile"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version = "1.96"

# Mobile bridge (UniFFI). Not a default member: desktop CI never builds it.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Only for the binding generator binary (scripts/mobile-bindings.sh).
bindgen = ["uniffi/cli"]

[dependencies]
matrix-domain = { path = "../matrix-domain" }
matrix-engine = { path = "../matrix-engine", features = ["sdk"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "sync", "macros", "time"] }
uniffi = { version = "=0.32.2", features = ["tokio"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

# iOS: the engine's own Keychain vault (sign-in/restore with `secrets: None`).
[target.'cfg(target_os = "ios")'.dependencies]
matrix-engine = { path = "../matrix-engine", features = ["sdk", "ios-vault"] }
