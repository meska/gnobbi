[package]
name = "matrix-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version = "1.96"

[features]
default = []
linux-vault = ["sdk", "dep:secret-service", "dep:getrandom"]
mac-vault = ["sdk", "dep:security-framework", "dep:getrandom"]
sdk = ["dep:matrix-sdk", "dep:tokio", "dep:url", "dep:reqwest", "dep:serde_json", "dep:matrix-sdk-store-encryption", "dep:zeroize", "dep:image", "dep:matrix-sdk-crypto", "dep:matrix-sdk-ui"]

[dependencies]
matrix-sdk-crypto = { version = "=0.19.1", optional = true, default-features = false }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zeroize = { version = "=1.9.1", optional = true }
matrix-domain = { path = "../matrix-domain" }
matrix-sdk-store-encryption = { version = "=0.19.1", optional = true }
matrix-sdk-ui = { version = "=0.19.1", optional = true, default-features = false }
matrix-sdk = { version = "=0.19.1", optional = true, default-features = false, features = ["e2e-encryption", "bundled-sqlite", "rustls-aws-lc-rs"] }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["rustls"] }
serde_json = { version = "=1.0.151", optional = true }
url = { version = "=2.5.8", optional = true }
tokio = { version = "=1.53.2", optional = true, default-features = false, features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }
getrandom = { version = "=0.4.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true, default-features = false }
getrandom = { version = "=0.4.3", optional = true }

[[test]]
name = "sdk_smoke"
required-features = ["sdk"]

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false }

[[test]]
name = "sliding_sync_probe"
required-features = ["sdk"]
