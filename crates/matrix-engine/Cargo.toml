[package]
name = "matrix-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version = "1.96"

[features]
default = []
linux-vault = ["sdk", "dep:secret-service", "dep:getrandom"]
mac-vault = ["sdk", "dep:security-framework", "dep:getrandom"]
ios-vault = ["sdk", "dep:security-framework", "dep:getrandom"]
android-vault = ["sdk", "dep:jni", "dep:ndk-context", "dep:getrandom"]
windows-vault = ["sdk", "dep:windows", "dep:getrandom"]
sdk = ["dep:tracing", "dep:matrix-sdk", "dep:tokio", "dep:url", "dep:reqwest", "dep:serde_json", "dep:matrix-sdk-store-encryption", "dep:image", "dep:mime_guess", "dep:matrix-sdk-crypto", "dep:matrix-sdk-ui", "dep:eyeball-im", "dep:futures-util", "dep:pulldown-cmark", "dep:gnobbi-nse"]

[dependencies]
# Push content: the notification extension's reader (iOS NSE, Android FCM service) and the contract test on AccountStore::seal (persistence_tests.rs).
gnobbi-nse = { path = "../gnobbi-nse", optional = true }
matrix-sdk-crypto = { version = "=0.19.1", optional = true, default-features = false }
opus-pure = "=0.2.3"
mime_guess = { version = "=2.0.5", optional = true, default-features = false }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zeroize = "=1.9.1"
unicode-normalization = "=0.1.25"
matrix-domain = { path = "../matrix-domain" }
matrix-sdk-store-encryption = { version = "=0.19.1", optional = true }
matrix-sdk-ui = { version = "=0.19.1", optional = true, default-features = false }
matrix-sdk = { version = "=0.19.1", optional = true, default-features = false, features = ["e2e-encryption", "bundled-sqlite", "rustls-aws-lc-rs", "markdown", "experimental-search"] }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["rustls"] }
serde_json = { version = "=1.0.151", optional = true }
url = { version = "=2.5.8", optional = true }
tokio = { version = "=1.53.2", optional = true, default-features = false, features = ["rt", "time", "macros", "sync"] }

tracing = { version = "=0.1.44", optional = true, default-features = false, features = ["std"] }
eyeball-im = { version = "=0.9.1", optional = true }
futures-util = { version = "=0.3.34", optional = true, default-features = false }
# Markdown of the room topic (already in the lock through ruma-events); raw HTML is turned into text.
pulldown-cmark = { version = "=0.13.5", optional = true, default-features = false, features = ["html"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }
getrandom = { version = "=0.4.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, default-features = false, features = ["Win32_Foundation", "Win32_Security_Credentials"] }
getrandom = { version = "=0.4.3", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "=3.7.0", optional = true, default-features = false }
getrandom = { version = "=0.4.3", optional = true }

# File protection of the message index (src/search_index.rs); same versions as matrix-desktop.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSDictionary", "NSFileManager", "NSError"] }

# Android: reqwest's platform verifier needs JNI and Java classes the NativeActivity app does not have, so TLS uses the embedded Mozilla roots.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "=1.0.10"
jni = { version = "=0.22.4", optional = true }
ndk-context = { version = "=0.1.1", optional = true }
getrandom = { version = "=0.4.3", optional = true }

[[test]]
name = "sdk_smoke"
required-features = ["sdk"]

[dev-dependencies]
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
futures-util = { version = "=0.3.34", default-features = false }
# Fake homeserver and paused clock of tests/sync_flapping.rs.
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "macros", "sync", "net", "io-util", "test-util"] }

[[test]]
name = "caption_variants"
required-features = ["sdk"]

[[test]]
name = "sliding_sync_probe"
