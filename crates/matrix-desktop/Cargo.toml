[package]
name = "matrix-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
matrix-domain = { path = "../matrix-domain" }
matrix-engine = { path = "../matrix-engine" }
serde_json = "=1.0.151"
url = "=2.5.8"
zeroize = "=1.9.1"
cpal = "=0.18.2"

image = { version = "=0.25.10", default-features = false, optional = true }

# GPUI backend features are per target. Non-macOS keeps exactly the Linux snapshot's
# wayland + x11. macOS uses Metal with shaders compiled at runtime (no Xcode Metal Toolchain
# needed) plus font-kit, without which GPUI falls back to NoopTextSystem and paints no text.
[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"], optional = true }

# Windows: the comctl32 v6 manifest gpui ships; without it the exe dies at load (TaskDialogIndirect not found).
[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit = { version = "=0.24.1", optional = true }
accesskit_unix = { version = "=0.22.1", optional = true }

[features]
# Experimental, incomplete Linux semantic adapter; not a release accessibility claim.
linux-a11y = ["dep:accesskit", "dep:accesskit_unix"]
default = ["desktop"]
desktop = ["dep:gpui", "dep:image"]
live = ["desktop", "matrix-engine/sdk"]
# Test-only fixture driver, absent from ordinary/default/live desktop builds.
perf-probe = ["desktop"]
# New profiles keep their protection secret in the OS vault instead of a local phrase.
linux-vault = ["live", "matrix-engine/linux-vault"]
mac-vault = ["live", "matrix-engine/mac-vault"]
windows-vault = ["live", "matrix-engine/windows-vault"]

[[bin]]
name = "gnobbi"
path = "src/main.rs"
required-features = ["desktop"]

# Fake compositor for tests/wayland_keymap_order.rs (modifiers sent before keymap).
[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["server"] }
