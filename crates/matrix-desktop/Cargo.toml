[package]
name = "matrix-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# App layer (lib) shared by the egui frontend (bin `gnobbi`); the egui forks are vendored, see the root Cargo.toml.
[dependencies]
matrix-domain = { path = "../matrix-domain" }
matrix-engine = { path = "../matrix-engine", features = ["sdk"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# Seed of the gnome picture (md5 of the account id); tiny, no dependencies.
md5 = "=0.7.0"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
zeroize = "=1.9.1"
cpal = "=0.18.2"
# Update signature check only (MIT, no dependencies); see src/update/verify.rs.
minisign-verify = "=0.3.0"
# Update check only (same version and features as matrix-engine).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
# Update scheduler runtime (check + download); same version as the dev-dependency.
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time"] }
sys-locale = "=0.3.2"
unicode-segmentation = "=1.13.3"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
egui_system_font_provider = "=0.37.0"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "system_fonts", "wgpu"] }

# AccessKit cannot be combined with android-native-activity (eframe compile_error); see docs on the Android spike.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit"] }

# Desktop only: file dialogs and Wayland/X11. iOS and Android have none of them.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Password prompt without echo for `gnobbi account` (MIT/Apache-2.0).
rpassword = "=7.5.5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
arboard = { version = "=3.7.0", default-features = false }
# `room-open.log` (room_open / paginate_backwards timings) in the data dir.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }

# Android: NativeActivity entry (android_main in the binary); `log` goes to logcat.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }
android-activity = "0.6"
android_logger = "0.15"
jni = "=0.22.4"
ndk-context = "=0.1.1"
libc = "=0.2.183"
log = "0.4"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

# iOS: stderr goes nowhere, so main() sends `log` and stderr to os_log.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.183"
log = "0.4"
oslog = "0.2"
# File/photo pickers (UIDocumentPicker, PHPicker); the share sheet is a few lines of objc2 in pick.rs.
robius-file-picker = "=0.3.1"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSURL", "NSBundle", "NSProcessInfo", "NSString", "NSError", "NSObject", "NSDictionary", "NSNotification", "NSOperation", "NSValue", "NSFileManager", "block2"] }
# Local notifications (UNUserNotificationCenter) and the microphone permission/session (AVAudioSession; cpal only opens the unit).
objc2-user-notifications = { version = "0.3", features = ["block2"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioSession", "AVAudioSessionTypes"] }
block2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIActivityViewController", "UIActivity", "block2", "UIApplication", "UIPopoverPresentationController", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIScene", "UIWindowScene", "UIScreen", "UIDevice", "UIDocumentPickerViewController", "UIPresentationController", "objc2-uniform-type-identifiers"] }
# PHPicker and UTType for the multiple selection (already in the tree through robius-file-picker).
objc2-photos-ui = { version = "0.3", default-features = false, features = ["std", "PHPicker"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
# Hide/unhide the whole app (an orderOut window gets no frames, so the tray click would never be seen).
cocoa = "=0.26.0"
objc = "=0.2.7"
# Native date/time formatter (CFDateFormatter) for time_fmt.
objc2-core-foundation = "=0.3.2"
# Notifications with a click (UNUserNotificationCenter).
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSBundle", "NSString", "NSError", "NSObject", "NSArray", "NSURL"] }
objc2-user-notifications = { version = "=0.3.2", features = ["block2"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Exe icon (packaging/windows/gnobbi.ico).
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "=3.0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# nl_langinfo_l for time_fmt (already in the tree).
libc = "=0.2.183"
# StatusNotifierItem over D-Bus (ksni); the libappindicator default would need GTK.
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
# Is a StatusNotifierWatcher on the bus? (already in the tree through ksni)
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api"] }

[dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "time", "macros", "sync"] }

[[bin]]
name = "gnobbi"
path = "src/bin/gnobbi/main.rs"

# Android loads a shared library, and only a library or an example can be a cdylib: the same app root built as an example
# (`cargo ndk rustc -p matrix-desktop --example gnobbi --crate-type cdylib`, see packaging/android). Cargo warns that the file is shared.
[[example]]
name = "gnobbi"
path = "src/bin/gnobbi/main.rs"
crate-type = ["cdylib"]
test = false

[features]
# Keeps the GNOBBI_EGUI_*/GNOBBI_DEBUG_* automation hooks in release builds (debug builds always have them).
test-hooks = []
# New profiles keep their protection secret in the OS vault.
linux-vault = ["matrix-engine/linux-vault"]
mac-vault = ["matrix-engine/mac-vault"]
windows-vault = ["matrix-engine/windows-vault"]
ios-vault = ["matrix-engine/ios-vault"]
android-vault = ["matrix-engine/android-vault"]
