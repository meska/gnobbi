# Single source of the design tokens. Edit here, then run `python3 design/generate.py`
# (from crates/matrix-domain). Colours are 0xRRGGBB except `scrim` (0xRRGGBBAA).
# Never write colours or measures by hand in the mobile apps: use the generated files.

[layout]            # logical px
width = 1120
height = 760
sidebar = 320
header = 64
composer = 72

[spacing]           # logical px
row_pad_y = 12
text_gap = 4

[constants]
scrim = "0x00000066"
avatar_fallback = "0x5288b5"

[strings]
demo_notice = "DEMO OFFLINE · nessun account connesso"

