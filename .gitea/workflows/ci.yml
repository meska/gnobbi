name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  linux:
    runs-on: linux-x86_64
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
          echo "CARGO_TARGET_DIR=$HOME/ci/target" >> "$GITHUB_ENV"
      - name: Design tokens drift
        run: |
          python3 crates/matrix-domain/design/generate.py
          git diff --exit-code
      - name: Icons
        run: python3 packaging/check-icons.py
      - name: Build
        run: cargo build --locked -j4 -p matrix-desktop --features live,linux-vault
      - name: Test
        run: cargo test --locked -j4 -p matrix-domain
      - name: Test engine
        run: cargo test --locked -j4 -p matrix-engine --features sdk --lib
      - name: Test desktop
        run: cargo test --locked -j4 -p matrix-desktop --features live
      - name: Composer rendered geometry (Xvfb, xauth, D-Bus)
        run: sh packaging/linux/test-composer-render.sh
      - name: AppImage
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
        run: |
          cargo build --locked -j4 -p matrix-desktop --features live,linux-vault --profile dist
          out="$HOME/ci/out/${{ gitea.sha }}"
          packaging/linux/build-appimage.sh "$out"
          ln -sfn "$out" "$HOME/ci/out/latest"
          mkdir -p "$HOME/ci/share"
          cp "$out/Gnobbi-x86_64.AppImage" "$HOME/ci/share/Gnobbi-x86_64.AppImage.new"
          mv "$HOME/ci/share/Gnobbi-x86_64.AppImage.new" "$HOME/ci/share/Gnobbi-x86_64.AppImage"
          printf 'commit=%s\nbuilt=%s\n' "${{ gitea.sha }}" "$(date -u +%FT%TZ)" > "$HOME/ci/share/BUILDINFO"
      - name: Status
        if: always()
        run: |
          mkdir -p "$HOME/ci/out"
          printf '%s %s linux\n' "${{ job.status }}" "$(date -u +%FT%TZ)" > "$HOME/ci/out/${{ gitea.sha }}.linux.status"
  macos:
    needs: linux
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: macos-arm64
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
          echo "CARGO_TARGET_DIR=$HOME/ci-runners/gitea/cargo-target" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked -j4 -p matrix-desktop --features live,mac-vault --profile dist
      - name: Package for TestFlight
        run: packaging/macos/build-testflight.sh "$HOME/ci-runners/gitea/out/${{ gitea.sha }}"
      - name: Upload to TestFlight (internal)
        run: |
          rc=0
          packaging/macos/upload-testflight.sh "$HOME/ci-runners/gitea/out/${{ gitea.sha }}/Gnobbi.pkg" upload || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 3 ]
      - name: Status
        if: always()
        run: |
          mkdir -p "$HOME/ci-runners/gitea/out"
          printf '%s %s macos\n' "${{ job.status }}" "$(date -u +%FT%TZ)" > "$HOME/ci-runners/gitea/out/${{ gitea.sha }}.macos.status"
  windows:
    needs: linux
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: windows-x64
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
      # Toolchain Rust MSVC e GPUI_FXC_PATH arrivano dal runner (runner.envs): niente setup nel workflow.
      - name: Build
        run: cargo build --locked -j4 --release -p matrix-desktop --features windows-vault
      - name: Test
        run: cargo test --locked -j4 -p matrix-domain
      - name: Test engine
        run: cargo test --locked -j4 -p matrix-engine --features sdk --lib
      - name: Package zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\make-tester-package.ps1
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnobbi-windows-x64
          path: dist/*.zip
          if-no-files-found: error
  ios-mobile:
    needs: linux
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: macos-arm64
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
          # Non-interactive runner PATH is /usr/bin:/bin:...; prepend the dedicated rustc 1.98.0
          # toolchain (runner stable 1.93.1 is older than rust-version 1.96) and brew (xcodegen).
          echo "PATH=$HOME/.rustup/toolchains/1.98.0-aarch64-apple-darwin/bin:/opt/homebrew/bin:$PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$HOME/ci-runners/gitea/cargo-target" >> "$GITHUB_ENV"
      - name: Bridge and xcframework
        run: scripts/mobile.sh ios
      - name: Stage and generate Xcode project
        run: |
          apps/ios/stage.sh "$CARGO_TARGET_DIR"
          (cd apps/ios && xcodegen)
      - name: Build app for simulator
        run: |
          cd apps/ios
          xcodebuild -project GnobbiMobile.xcodeproj -scheme GnobbiMobile -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
      - name: Status
        if: always()
        run: |
          mkdir -p "$HOME/ci-runners/gitea/out"
          printf '%s %s ios-mobile\n' "${{ job.status }}" "$(date -u +%FT%TZ)" > "$HOME/ci-runners/gitea/out/${{ gitea.sha }}.ios-mobile.status"
  publish:
    needs: [linux, macos]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: linux-x86_64
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
      - name: Prove negative verifica firma (MANIFEST_SIGNING.md §5.8)
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          gen() { jq -nc --argjson b "$1" --arg vu "$2" '{schema:1,version:"0.0.0",build:$b,
              commit:"0000000000000000000000000000000000000000",released:"2026-01-01T00:00:00Z",
              valid_until:$vu,channel:"stable",artifacts:{}}' >"$T/m$1.json"; }
          expect_fail() { if packaging/linux/publish-site.sh --verify "$@"; then
              echo "::error::verifica accettata dove doveva rifiutare: $*"; exit 1; fi; }
          vu="$(date -u -d '+30 days' +%Y-%m-%dT%H:%M:%SZ)"
          gen 7 "$vu"
          packaging/linux/publish-site.sh --sign "$T/m7.json" 7
          packaging/linux/publish-site.sh --verify "$T/m7.json" "$T/m7.json.minisig"
          sed -i '2s/^\(.\)\(.\)/\2\1/' "$T/m7.json.minisig"
          expect_fail "$T/m7.json" "$T/m7.json.minisig"
          jq -c '.build=99' "$T/m7.json" >"$T/m7.mod" && mv "$T/m7.mod" "$T/m7.json"
          expect_fail "$T/m7.json" "$T/m7.json.minisig"
          gen 8 "$vu"
          packaging/linux/publish-site.sh --sign "$T/m8.json" 7
          expect_fail "$T/m8.json" "$T/m8.json.minisig"
          printf 'eph\neph\n' | minisign -G -s "$T/r.key" -p "$T/r.pub"
          printf 'eph\n' >"$T/r.pass" && chmod 600 "$T/r.pass"
          gen 9 "$vu"
          SIGN_KEY="$T/r.key" SIGN_PASSPHRASE_FILE="$T/r.pass" \
            packaging/linux/publish-site.sh --sign "$T/m9.json" 9
          expect_fail "$T/m9.json" "$T/m9.json.minisig"
          gen 10 2020-01-01T00:00:00Z
          packaging/linux/publish-site.sh --sign "$T/m10.json" 10
          expect_fail "$T/m10.json" "$T/m10.json.minisig"
          echo "prove negative OK: R3/R4/R5/R7 rifiutati, firma buona accettata"
      - name: Test firma manifesto (casi negativi e di bordo, chiave efimera)
        run: packaging/linux/test-publish-signing.sh
      - name: Publish AppImage
        run: |
          app="$HOME/ci/share/Gnobbi-x86_64.AppImage"
          built="$(sed -n 's/^commit=//p' "$HOME/ci/share/BUILDINFO" 2>/dev/null || true)"
          if [ ! -f "$app" ]; then
            echo "::error::AppImage del job linux assente in \$HOME/ci/share (job AppImage non eseguito?)"
            exit 1
          fi
          if [ "$built" != "${{ gitea.sha }}" ]; then
            echo "::error::AppImage costruita da commit diverso (BUILDINFO=$built, CI=${{ gitea.sha }})"
            exit 1
          fi
          # build = rev-list count: deve coincidere con BUILD_INFO.build del binario (build.rs)
          build="$(git rev-list --count HEAD)"
          rc=0
          packaging/linux/publish-site.sh "$app" "$build" "${{ gitea.sha }}" || rc=$?
          if [ "$rc" = 75 ]; then
            echo "::warning::PUBLISH SKIPPED: sito irraggiungibile (publish-site.sh rc=75)"
            printf 'PUBLISH SKIPPED: sito irraggiungibile (rc=75), build %s non pubblicata.\n' "$build" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::publish fallito: publish-site.sh rc=$rc (2=config, 3=verifica, 4=upload)"
            exit "$rc"
          fi
          printf 'Publish OK: build %s (%s) - latest.json e AppImage aggiornati.\n' "$build" "${{ gitea.sha }}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
