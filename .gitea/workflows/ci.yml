name: ci
on:
  push:
    branches: ['ci/**']
    tags: ['v*.*.0']
  pull_request:
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  debounce:
    runs-on: linux-x86_64
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      # Debounce (owner 05/11): build only the last push on a ref. A newer push
      # cancels this run via workflow concurrency, or makes it stale here.
      - name: Wait 30 minutes
        if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/heads/')
        run: sleep 1800
      - name: Check ref freshness
        id: check
        run: |
          if [ "${{ gitea.event_name }}" != 'push' ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote="$(git -c http.extraHeader="Authorization: token ${{ gitea.token }}" \
            ls-remote "${{ gitea.server_url }}/${{ gitea.repository }}.git" "${{ gitea.ref }}" | cut -f1)"
          if [ -n "$remote" ] && [ "$remote" != "${{ gitea.sha }}" ]; then
            echo "ref ${{ gitea.ref }} moved to $remote; run for ${{ gitea.sha }} is stale"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
  linux:
    needs: debounce
    if: needs.debounce.outputs.stale != 'true'
    runs-on: linux-x86_64
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
          echo "CARGO_TARGET_DIR=$HOME/ci/target" >> "$GITHUB_ENV"
      - name: Design tokens drift
        run: |
          python3 crates/matrix-domain/design/generate.py
          git diff --exit-code
      - name: Icons
        run: python3 packaging/check-icons.py
      - name: Build
        run: cargo build --locked -j4 -p matrix-desktop --features linux-vault
      - name: Test
        run: cargo test --locked -j4 -p matrix-domain
      - name: Test engine
        run: cargo test --locked -j4 -p matrix-engine --features sdk --lib
      - name: Test desktop
        run: cargo test --locked -j4 -p matrix-desktop
      - name: Layering (no UI toolkit below the frontend)
        run: |
          ! { cargo tree --locked -e normal -p matrix-domain; cargo tree --locked -e normal -p matrix-engine; } | grep -E 'egui|eframe|winit|wgpu'
      - name: Status
        if: always()
        run: |
          mkdir -p "$HOME/ci/out"
          printf '%s %s linux\n' "${{ job.status }}" "$(date -u +%FT%TZ)" > "$HOME/ci/out/${{ gitea.sha }}.linux.status"
  ios-check:
    needs: [debounce, linux]
    if: gitea.event_name == 'push' && startsWith(gitea.ref, 'refs/tags/v') && needs.debounce.outputs.stale != 'true'
    runs-on: macos-arm64
    steps:
      - name: Checkout
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token ${{ gitea.token }}" fetch -q "${{ gitea.server_url }}/${{ gitea.repository }}.git" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q "${{ gitea.sha }}"
          # Non-interactive runner PATH is /usr/bin:/bin:...; prepend the dedicated rustc 1.98.0
          # toolchain (runner stable 1.93.1 is older than rust-version 1.96).
          echo "PATH=$HOME/.rustup/toolchains/1.98.0-aarch64-apple-darwin/bin:/opt/homebrew/bin:$PATH" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$HOME/ci-runners/gitea/cargo-target" >> "$GITHUB_ENV"
      - name: Check iOS app
        run: cargo check --locked --target aarch64-apple-ios -p matrix-desktop --bin gnobbi --features ios-vault
      - name: Check iOS notification extension
        run: cargo check --locked --target aarch64-apple-ios -p gnobbi-nse
      - name: Status
        if: always()
        run: |
          mkdir -p "$HOME/ci-runners/gitea/out"
          printf '%s %s ios-check\n' "${{ job.status }}" "$(date -u +%FT%TZ)" > "$HOME/ci-runners/gitea/out/${{ gitea.sha }}.ios-check.status"
